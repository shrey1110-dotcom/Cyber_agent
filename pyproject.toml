[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-agent"
version = "0.1.0"
description = "A safe, local-first agent shell for a future custom cybersecurity model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cyber Agent contributors" }]
dependencies = [
    "tokenizers>=0.22,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.scripts]
cyber-agent = "cyber_agent.cli:main"
cyber-data = "cyber_agent.data_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
